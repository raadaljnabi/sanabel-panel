<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سنابل الطاحونة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&family=Cairo:wght@400;700;800&family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6f1;--card:#ffffff;--ink:#3b2a2a;--mut:#8a7474;--ac:#d9467a;--acink:#fff;--line:#f0dcd6;--dark:#2a1c20;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1416;--card:#2a1e21;--ink:#f6e9e6;--mut:#b49c9c;--line:#41302f}}
:root[data-theme="dark"]{--bg:#1b1416;--card:#2a1e21;--ink:#f6e9e6;--mut:#b49c9c;--line:#41302f}
*{box-sizing:border-box;margin:0;min-width:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ff,'Tajawal'),Tahoma,Arial,sans-serif;display:flex;justify-content:center}
button,input,select{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent;transition:transform .12s ease,filter .12s ease,box-shadow .12s ease}
button:disabled{opacity:.35;cursor:default}
#app{width:100%;max-width:1600px;height:100%;display:flex;flex-direction:column;padding:clamp(10px,1.6vw,22px);gap:clamp(10px,1.2vw,16px);zoom:var(--z,1)}
@supports (height:100dvh){html,body{height:100dvh}}
/* Screen scaling: bigger content on large screens (TVs and big tablets) */
@media (min-width:1300px) and (min-height:850px){:root{--z:1.15}}
@media (min-width:1600px) and (min-height:950px){:root{--z:1.3}}
@media (min-width:2200px) and (min-height:1200px){:root{--z:1.6}}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:26px;font-weight:800}
.brand{display:flex;align-items:center;gap:12px}
.bn{font-size:26px;font-weight:800;line-height:1.15}
.bs{font-size:14px;color:var(--mut);font-weight:400}
.logo{height:var(--lh,44px);max-width:170px;object-fit:contain}
.ib{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700}
.pri{background:var(--ac);color:var(--acink);border-radius:12px;padding:10px 18px;font-weight:700;white-space:nowrap}
.ghost{border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:700;color:var(--mut)}
.dng{color:#d33;border:1px solid #e6a1a1;border-radius:10px;padding:6px 12px;font-weight:700}
.sq{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:13px}
nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 22px;font-size:18px;font-weight:700}
.chip.on{background:var(--ac);color:var(--acink);border-color:var(--ac)}
.chip:active,.ib:active,.pri:active,.dng:active,.ghost:active,.sq:active,.atab:active{transform:scale(.94)}

/* شاشة الترحيب */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 42%,#fffaf0 0%,#f6e7c8 70%,#efd9ad 100%);transition:opacity .7s ease,visibility .7s;cursor:pointer;padding:20px;text-align:center}
#splash.out{opacity:0;visibility:hidden}
#splash>svg{width:min(48vw,40vh,300px);height:auto;filter:drop-shadow(0 14px 28px rgba(107,66,32,.25));animation:pop .9s cubic-bezier(.2,1.35,.4,1) both}
#splash .splogo{width:min(48vw,40vh,300px);height:min(48vw,40vh,300px);object-fit:contain;filter:drop-shadow(0 14px 28px rgba(107,66,32,.25));animation:pop .9s cubic-bezier(.2,1.35,.4,1) both,float 3s ease-in-out 1s infinite}
@keyframes float{50%{transform:translateY(-8px)}}
#splash .blades{animation:spin1 1.7s cubic-bezier(.2,0,.2,1) .25s both,spin2 5s linear 1.95s infinite}
#splash .ear{transform-origin:0 0;animation:grow .9s cubic-bezier(.2,1.3,.4,1) both}
.spn{font-family:'Cairo','Tajawal',sans-serif;font-size:clamp(32px,7vw,64px);font-weight:800;color:#6b4220;line-height:1.1;animation:up .7s ease .95s both}
.spl{width:min(220px,40vw);height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#c99a3e,transparent);animation:line .8s ease 1.2s both}
.sps{font-size:clamp(15px,2.4vw,22px);color:#9b7442;min-height:1em;animation:up .7s ease 1.35s both}
@keyframes pop{from{transform:scale(.35) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes spin1{from{transform:rotate(0)}to{transform:rotate(450deg)}}
@keyframes spin2{from{transform:rotate(90deg)}to{transform:rotate(450deg)}}
@keyframes grow{from{transform:scale(0)}to{transform:none}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes line{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}

/* الأقسام */
.tiles{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(clamp(150px,min(23vw,34vh),360px),44%),1fr));grid-auto-rows:max-content;gap:clamp(12px,1.6vw,22px);align-content:start;padding:6px}
.tile span{font-size:clamp(17px,2vw,28px)}
.tile{position:relative;aspect-ratio:1;width:100%;display:block;border-radius:var(--rad,22px);overflow:hidden;background:var(--dark);padding:0;
border:4px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 8px 22px rgba(60,30,30,.14)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile span{position:absolute;inset:auto 0 0 0;padding:28px 12px 14px;color:#fff;font-size:22px;font-weight:800;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.tile small{display:block;font-size:14px;font-weight:400;opacity:.85}
.tile:active{transform:scale(.95)}
@media (max-width:520px){.tile span{font-size:17px;padding:20px 8px 10px}.tile small{font-size:12px}.tiles{gap:12px}.bn{font-size:21px}}

/* السلايدر */
.body{flex:1;min-height:0;display:flex;gap:14px}
.stagew{flex:1;min-height:0;min-width:0;container-type:size;display:flex;justify-content:center;align-items:center}
.stage{position:relative;width:min(100cqw,calc(100cqh*var(--rw,3)/var(--rh,4)));height:min(100cqh,calc(100cqw*var(--rh,4)/var(--rw,3)));border-radius:22px;overflow:hidden;background:var(--dark);direction:ltr;touch-action:pan-y;cursor:pointer;user-select:none;border:4px solid #fff;box-shadow:0 8px 22px rgba(60,30,30,.14)}
.track{display:flex;height:100%;transition:transform .5s ease}
.slide{flex:none;width:100%;height:100%;position:relative}
.slide img{width:100%;height:100%;object-fit:var(--fit,contain);pointer-events:none;-webkit-user-drag:none;user-select:none}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.88);color:#333;font-size:26px}
.arr.l{left:14px}.arr.r{right:14px}
.arr:active{transform:translateY(-50%) scale(.88)}
.dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.5);padding:0}
.dot.on{background:#fff;width:26px;border-radius:6px}
.hint{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.45);color:#fff;font-size:13px;padding:4px 10px;border-radius:999px;direction:rtl;pointer-events:none}
.info{flex:0 0 min(36%,360px);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.info:empty{display:none}
.in-t{font-size:26px;font-weight:800}
.in-r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--bg);font-size:20px;font-weight:700}
.in-r b{color:var(--ac);font-size:22px;white-space:nowrap}
@media (max-width:760px),(max-aspect-ratio:1/1){.body{flex-direction:column}.info{flex:0 0 auto;max-height:34%}}
.emptyw{flex:1;display:grid;place-items:center;color:var(--mut);font-size:20px}

/* الشبكة والعمودي */
.gal{flex:1;min-height:0;overflow:auto;padding:6px;grid-auto-rows:max-content}
.gv{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,46%),1fr));gap:14px;align-content:start}
.lv{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:12px;align-content:start}
.lv .gi{flex-direction:row;align-items:stretch;border-width:3px;border-radius:18px}
.lv .gi img{flex:none;width:clamp(104px,26vw,150px);aspect-ratio:1;object-fit:cover;border-radius:14px;margin:8px}
.lv .gc{flex:1;justify-content:center;padding:10px 4px 10px 12px;gap:6px}
.lv .gc b{font-size:19px}
.gd{color:var(--mut);font-size:15px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lv .gd{-webkit-line-clamp:3}
.in-d{color:var(--mut);font-size:17px;line-height:1.6}
#lbinfo .gd{color:rgba(255,255,255,.75);font-size:16px;-webkit-line-clamp:4;max-width:640px}
textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:100%;font-family:inherit;font-size:16px;color:inherit;resize:vertical;min-height:60px}
textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
.gi{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s;display:flex;flex-direction:column;align-self:stretch;width:100%;padding:0;background:var(--card);border:4px solid #fff;border-radius:20px;overflow:hidden;text-align:inherit;box-shadow:0 0 0 1px rgba(0,0,0,.05),0 8px 20px rgba(60,30,30,.12)}
.gi img{display:block;width:100%;aspect-ratio:var(--rw,3)/var(--rh,4);object-fit:var(--fit,cover);background:var(--dark)}
.gi:active{transform:scale(.97)}
.gc{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.gc b{font-size:18px}
.gv .gc{flex:1}.gv .gc .chips{margin-top:auto;flex-direction:column;align-items:flex-start}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:15px;font-weight:700;white-space:nowrap}
.chips i{font-style:normal;color:var(--ac)}
.chips em{font-style:normal}.chips em+i::before{content:' · ';color:var(--mut)}
.gv .chips{align-items:stretch!important;flex-wrap:nowrap}.gv .chips span{display:flex;justify-content:space-between;gap:8px;border-radius:10px}.gv .chips em+i::before{content:none}.gv .chips em{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gv .chips i{flex:none}
@media (max-width:520px){.gv .chips span{flex-direction:column;align-items:flex-start;gap:0;padding:4px 10px}.gv .chips em{white-space:normal;overflow:visible}.gv{gap:10px}.gv .gc{padding:8px}.gv .gc b{font-size:16px}.gv .chips span{font-size:12.5px;padding:3px 8px}.gv .gd{font-size:13px}}

/* عارض الصورة الكبير */
#lb{position:fixed;inset:0;z-index:50;background:#0f0b0d;display:flex;flex-direction:column;color:#fff}
#lbn{direction:ltr;unicode-bidi:isolate;font-weight:700}
#lb[hidden],#dlg[hidden]{display:none}
.lbt{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.lbx{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:22px}
#lbs{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;direction:ltr}
#lbimg{max-width:100%;max-height:100%;object-fit:contain;transition:transform .25s ease;user-select:none;-webkit-user-drag:none;cursor:zoom-in}
#lbimg.z{cursor:zoom-out}
#lb .arr{background:rgba(255,255,255,.18);color:#fff}
#lbinfo{padding:12px 16px calc(18px + env(safe-area-inset-bottom,0px));text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
#lbinfo b{font-size:22px}
#lbinfo .chips span{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff;font-size:17px}
#lbinfo .chips i{color:#ffd27a}

/* الدخول */
.login{margin:auto;width:min(420px,100%);display:flex;flex-direction:column;gap:12px;text-align:center}
.login .box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:12px}
.err{color:#d33;min-height:20px}
input[type=text],input[type=password],input[type=number],input[type=tel],input[type=date],input[type=time],input[type=search],select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:1px}
label{display:block;font-weight:700;margin:14px 0 6px}
.card label:first-of-type{margin-top:0}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.row input,.row select{flex:1}

/* لوحة التحكم */
.ah{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ah .bs{font-size:13px}
.aact{display:flex;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.st b{font-size:28px;color:var(--ac);line-height:1}
.st span{color:var(--mut);font-size:14px}
.atabs{display:flex;gap:6px;overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px}
.atab{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:12px;font-weight:700;color:var(--mut)}
.atab.on{background:var(--ac);color:var(--acink)}
.panel{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.card h3{font-size:17px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 small{font-weight:400;color:var(--mut);font-size:13px}
.lr{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.lr:first-of-type{border-top:0}
.th0{flex:none;width:48px;height:48px;border-radius:12px;overflow:hidden;background:var(--dark);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.th0 img{width:100%;height:100%;object-fit:cover}
.lr input{flex:1 1 180px}
.lr{flex-wrap:wrap}
.nw{white-space:nowrap}
.mv{display:flex;gap:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.it{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}
.itim{position:relative}
.itim img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px}
.chg{position:absolute;bottom:8px;left:8px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.94);color:#333;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.chg:active{transform:scale(.94)}
.sr{display:flex;gap:6px;align-items:center}
.sr input{padding:6px 8px}
.sr .sn{flex:1.3}.sr .sp{flex:1}
.sr .dng{padding:4px 9px}
.itf{display:flex;justify-content:space-between;align-items:center;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.sw{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw button{width:42px;height:42px;border-radius:50%;border:3px solid var(--line)}
input[type=color]{width:56px;height:42px;padding:2px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.th{display:flex;gap:10px;flex-wrap:wrap}
.th button{width:100px;height:58px;border-radius:14px;border:3px solid var(--line);font-size:14px;font-weight:700}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px 16px;font-weight:700}
.seg button.on{border-color:var(--ac);background:var(--ac);color:var(--acink)}
.vm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.vm button{border:2px solid var(--line);border-radius:14px;padding:12px 8px;background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700}
.vm button.on{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
.vm svg{color:var(--ac)}
.af{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--mut);padding:0 4px}
.wa{display:flex;align-items:center;gap:8px;background:#1faa59;color:#fff;text-decoration:none;border-radius:12px;padding:9px 14px;font-weight:700}
.wa b{direction:ltr;unicode-bidi:isolate}
.cr b{color:var(--ink);direction:ltr;unicode-bidi:isolate}
@media (max-width:560px){.st{padding:10px 12px}.st b{font-size:22px}.atab{flex:1 1 0;flex-direction:column;gap:4px;padding:8px 4px}.atab span{font-size:12px;white-space:nowrap}.ah .brand .bn{font-size:20px}.lr .nw{margin-inline-start:58px}.af{justify-content:center}}

/* صفحة الكيكة والحجز */
#pd{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;flex-direction:column}
#pd[hidden]{display:none}
.pds{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.pdw{max-width:1180px;margin:0 auto}
.pdimg{position:relative;background:var(--dark);height:min(48vh,110vw);overflow:hidden}
.pdimg img{width:100%;height:100%;object-fit:var(--fit,cover);cursor:zoom-in}
.pdback{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:46px;height:46px;border-radius:14px;background:var(--ac);color:var(--acink);font-size:22px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.pdback.s{position:static;flex:none;box-shadow:none}
.pdimg .hint{top:auto;bottom:40px;right:auto;left:14px}
.pdb{position:relative;background:var(--card);border-radius:28px 28px 0 0;margin-top:-26px;padding:38px 20px 28px;display:flex;flex-direction:column;gap:14px}
.qty{position:absolute;top:-22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;background:var(--ac);color:var(--acink);border-radius:999px;padding:5px 8px;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.qty button{width:34px;height:34px;border-radius:50%;color:inherit;font-size:22px;font-weight:800;line-height:1}
.qty b{font-size:19px;min-width:18px;text-align:center}
.pdh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pdh h2{font-size:clamp(22px,3vw,30px);font-weight:800;line-height:1.25}
.pdp{color:var(--ac);font-size:clamp(20px,2.6vw,28px);font-weight:800;white-space:nowrap}
.pdp small{font-size:13px;font-weight:700;color:var(--mut)}
.pdd{color:var(--mut);font-size:16px;line-height:1.7}
.pdb h4{font-size:17px;font-weight:800;margin-top:6px}
.pdb h4 small{font-weight:400;color:var(--mut);font-size:13px}
.pdb label{margin:0 0 6px}
.szs{display:flex;flex-wrap:wrap;gap:10px}
.szs button{border:2px solid var(--line);border-radius:16px;padding:10px 18px;background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;min-width:110px}
.szs button small{font-weight:700;color:var(--ac)}
.szs button.on{background:var(--ac);border-color:var(--ac);color:var(--acink)}
.szs button.on small{color:var(--acink)}
.ads{display:flex;flex-direction:column;gap:8px}
.adr{display:flex;align-items:center;gap:12px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--bg);text-align:start;font-weight:700}
.adr .nm{flex:1}
.adr b{color:var(--ac);white-space:nowrap}
.ck{width:24px;height:24px;border-radius:7px;border:2px solid var(--mut);display:grid;place-items:center;flex:none}
.adr.on{border-color:var(--ac)}
.adr.on .ck{background:var(--ac);border-color:var(--ac)}

/* نافذة التأكيد والتنبيه */
#dlg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:20px}
.dbox{background:var(--card);border-radius:20px;padding:22px;width:min(360px,100%);display:flex;flex-direction:column;gap:18px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
#dmsg{font-size:18px;font-weight:700}
.dact{display:flex;gap:10px}.dact button{flex:1;padding:12px;border-radius:12px;font-weight:700}
#dyes{background:#d33;color:#fff}#dno{border:1px solid var(--line)}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:70;transition:.25s;pointer-events:none}
#pd:not([hidden])~#toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* الحركة والتحميل */
#ld{position:fixed;top:0;left:0;right:0;height:3px;z-index:300;pointer-events:none;display:flex}
#ld i{display:block;height:100%;width:0;background:var(--ac);box-shadow:0 0 10px var(--ac);border-radius:0 3px 3px 0;opacity:0}
#ld.go i{animation:ldbar .6s cubic-bezier(.3,.7,.3,1) forwards}
@keyframes ldbar{0%{width:0;opacity:1}65%{width:80%;opacity:1}100%{width:100%;opacity:0}}
.pgin>*{animation:pgin .32s cubic-bezier(.2,.75,.25,1) both}
.pgin>*:nth-child(2){animation-delay:.03s}.pgin>*:nth-child(3){animation-delay:.06s}.pgin>*:nth-child(4){animation-delay:.09s}.pgin>*:nth-child(n+5){animation-delay:.12s}
@keyframes pgin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.2;transform:scale(0);animation:rp .55s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
#pd:not([hidden]){animation:pdin .32s cubic-bezier(.2,.8,.2,1)}
@keyframes pdin{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
#lb:not([hidden]),#dlg:not([hidden]){animation:fade .22s ease}
#dlg:not([hidden]) .dbox{animation:pop2 .26s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop2{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
#lbimg{animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.adm.sbo .side{transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sbov{animation:fade .2s}
@media (prefers-reduced-motion:reduce){*{transition:none!important}#ld,.rp{display:none}.pgin>*,#pd,#lb,#dlg,.dbox,#lbimg{animation:none!important}}
/* Notifications */
.bellb{position:relative;flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--ink);cursor:pointer;padding:0}
.bellb em{position:absolute;top:-4px;left:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:#e5484d;color:#fff;font:700 11px/20px var(--ff,inherit);font-style:normal;text-align:center;box-shadow:0 0 0 2px var(--card)}
.hacc{display:flex;align-items:center;gap:8px;flex:none}
header .hbell+.uchip,header .hbell+.ib{display:inline-flex}
#ntp{position:fixed;top:64px;left:16px;width:min(400px,calc(100vw - 32px));max-height:min(560px,75vh);display:flex;flex-direction:column;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.18);z-index:95;overflow:hidden}
#ntp[hidden]{display:none}
.nth{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}.nth b{font-size:17px}.nth .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ntdesk{margin:10px 12px 0;padding:10px;border-radius:12px;border:1px dashed var(--ac);background:transparent;color:var(--ink);font:inherit;cursor:pointer}
.ntl{overflow:auto;padding:6px}
.nti{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;padding:10px;border-radius:12px;background:none;border:0;color:inherit;font:inherit;cursor:pointer}
.nti:hover{background:rgba(127,127,127,.08)}.nti .ic{font-size:20px;line-height:1.2}.nti b{display:block;font-weight:500;line-height:1.5}.nti small{color:var(--mut);font-size:12px}
.nti.un{background:color-mix(in srgb,var(--ac) 9%,transparent)}.nti.un b{font-weight:700}
#ntb{position:fixed;top:-120px;left:50%;transform:translateX(-50%);z-index:99;display:flex;gap:10px;align-items:center;max-width:min(560px,calc(100vw - 24px));padding:14px 18px;border-radius:16px;background:#1f1a1c;color:#fff;box-shadow:0 14px 40px rgba(0,0,0,.3);cursor:pointer;transition:top .35s cubic-bezier(.2,.9,.3,1.2);font-weight:600}
#ntb.show{top:14px}#ntb .ic{font-size:22px}
/* Booking hints */
.bkh{margin-top:6px;font-size:13.5px;color:var(--mut);line-height:1.6}.bkh:empty{display:none}.bkh b{color:var(--ink)}.bkh .late,.late{color:#d64545!important}
/* Customers */
.cusl{padding:6px!important}.cusr{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:start;cursor:pointer}
.cusr:last-child{border-bottom:0}.cusr:hover{background:rgba(127,127,127,.06)}.cusr .grow,.lr .grow{flex:1;min-width:0}.cusr .grow b,.cusr .grow small{display:block}.cusr small{color:var(--mut);font-size:12px}
.cusr .cn{text-align:center;min-width:56px}.cusr .cn b{display:block}.cdl{font-size:12px;min-width:76px;text-align:left}
.occ{align-items:center}.occ.sent{opacity:.6}.occ .pill{white-space:nowrap}
.cusd .cuso{max-height:40vh;overflow:auto;margin:10px 0;border:1px solid var(--line);border-radius:12px}
.cuoi{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:start;cursor:pointer}.cuoi:last-child{border-bottom:0}.cuoi .grow{flex:1}.cuoi small{display:block;color:var(--mut);font-size:12px}
.cuwa{display:flex;justify-content:center;align-items:center;gap:6px;padding:10px;border-radius:12px;text-decoration:none}
.pill.st-new{background:#e8f0ff;color:#2a5bd7}.pill.st-prep{background:#fff3df;color:#b46b00}.pill.st-ready{background:#e3f7ea;color:#1c8a4a}.pill.st-done{background:#eee;color:#555}.pill.st-cancel{background:#fde8e8;color:#c03030}
/* Calendar */
.calh{display:flex;align-items:center;gap:10px;margin-bottom:12px}.calh b{flex:1;text-align:center;font-size:18px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cwd{text-align:center;font-size:12px;color:var(--mut);padding:4px 0}
.cday{position:relative;min-height:66px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:6px 2px}
.cday i{position:absolute;top:5px;right:8px;font-style:normal;font-size:12px;color:var(--mut)}.cday b{font-size:20px;line-height:1.1}.cday small{font-size:10.5px;color:var(--mut)}
.cday.past{opacity:.55}.cday.tod{border:2px solid var(--ac)}.cday.sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 35%,transparent)}
.cday.lo{background:#eaf7ef}.cday.hi{background:#fff2dc}.cday.full{background:#fde3e3}.cday.full b{color:#c62f2f}
.calk{display:flex;gap:14px;justify-content:center;margin-top:12px;font-size:13px;color:var(--mut)}.calk i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-inline-end:5px;vertical-align:-1px}.calk .lo{background:#cdeedb}.calk .hi{background:#ffe1ad}.calk .full{background:#f8c4c4}
/* Activity log */
.lgl{padding:8px 14px!important}.lgd{font-weight:800;font-size:13px;color:var(--mut);margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}.lgd:first-child{margin-top:4px}
.lgi{display:flex;gap:10px;align-items:flex-start;padding:7px 0;line-height:1.6}.lgi .t{font-size:12px;color:var(--mut);min-width:64px;padding-top:3px;direction:ltr;text-align:right}.lgi .av{width:28px;height:28px;font-size:13px;flex:none}.lgi .tx{flex:1}
.lgi.k-cash .tx,.lgi.k-price .tx{background:color-mix(in srgb,var(--ac) 8%,transparent);border-radius:8px;padding:2px 8px}
/* Kitchen */
#app.iskit{max-width:none;padding:0}
.kitw{min-height:100vh;background:#15110f;color:#f3ece6;padding:14px 16px 30px}
.kith{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}.kith img{width:48px;height:48px;border-radius:50%;background:#fff}.kith b{display:block;font-size:22px}.kith small{color:#b9aaa0}
.kclock{margin-inline-start:auto;font-size:30px;font-weight:800;direction:ltr}
.kith .seg button{background:#2a2320;color:#e8ddd5;border-color:#3a302b}.kith .seg button.on{background:var(--ac);color:var(--acink)}.kith .ib,.kith .bellb{background:#2a2320;color:#f3ece6;border-color:#3a302b}
.kcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.kcol{background:#1e1916;border-radius:18px;padding:12px;min-height:60vh}.kcol h2{font-size:19px;margin:2px 4px 12px;display:flex;justify-content:space-between}.kcol h2 em{font-style:normal;background:#3a302b;border-radius:999px;padding:0 12px}
.k-new h2{color:#8fb4ff}.k-prep h2{color:#ffc46b}.k-ready h2{color:#7fdca0}
.kc{background:#2a2320;border-radius:14px;padding:12px;margin-bottom:12px;border:2px solid transparent}.kc.soon{border-color:#e0a030}.kc.late{border-color:#e5484d;background:#3a2222}
.kch{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px;font-size:15px}.kch>b{font-size:22px}
.kcb{display:flex;gap:10px;align-items:flex-start}.kcb>img:first-child{width:76px;height:76px;object-fit:cover;border-radius:10px;flex:none}.kcb>div{flex:1;line-height:1.7;font-size:15px}.kcb .kit{font-size:18px}
.kcb .oph{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;border:2px solid #fff;cursor:zoom-in}
.ktx{margin-top:8px;background:#fff6dc;color:#4a3300;border-radius:10px;padding:8px 10px;font-size:19px;font-weight:800;text-align:center}
.knt{margin-top:6px;color:#e8c9b8;font-size:15px}
.kbtn{display:block;width:100%;margin-top:10px;padding:14px;border:0;border-radius:12px;background:var(--ac);color:var(--acink);font:inherit;font-size:18px;font-weight:800;cursor:pointer}
.k-prep .kbtn{background:#2f9e6f;color:#fff}.kwait{margin-top:10px;text-align:center;color:#7fdca0;font-weight:700}.kemp{color:#7d6f66;text-align:center;padding:30px 0}
@media (max-width:900px){.kcols{grid-template-columns:1fr}.kcol{min-height:0}.kclock{font-size:24px}}
@media (max-width:560px){.cday{min-height:52px}.cday b{font-size:16px}.cusr .cdl{display:none}.cusr .cn{min-width:44px}}

/* Customer photos + QR */
.phm{flex-direction:column;align-items:stretch}.phts{display:flex;gap:10px;flex-wrap:wrap}.pht{position:relative}.pht img{width:84px;height:84px}
.phx{position:absolute;top:-8px;left:-8px;width:26px;height:26px;border-radius:50%;border:0;background:#d64545;color:#fff;font-size:13px;cursor:pointer;padding:0}
.phbtn{display:flex;gap:8px;flex-wrap:wrap}.phbtn .ib{flex:1;min-width:150px;justify-content:center}
#qrm{position:fixed;inset:0;z-index:120;background:rgba(20,14,12,.6);display:grid;place-items:center;padding:16px}#qrm[hidden]{display:none}
.qrb{background:var(--card);color:var(--ink);border-radius:22px;padding:20px 22px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}.qrb h3{margin:0 0 10px}
.qrc{display:inline-block;background:#fff;padding:8px;border-radius:14px;border:1px solid var(--line)}.qrc svg{display:block;width:250px;height:250px;max-width:70vw;max-height:70vw}
.qrs{text-align:start;margin:12px 0 6px;padding-inline-start:20px;line-height:1.8;font-size:14px}.qrw{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:10px;border-radius:12px;background:color-mix(in srgb,var(--ac) 10%,transparent);font-size:14px}
.spin.sm{width:16px;height:16px;border-width:2px;margin:0;display:inline-block}
.phw{position:relative;display:inline-flex;flex:none}.phn{position:absolute;bottom:-6px;left:-6px;min-width:22px;height:22px;border-radius:999px;background:var(--ac);color:var(--acink);font:700 12px/22px var(--ff,inherit);font-style:normal;text-align:center;box-shadow:0 0 0 2px var(--card)}
</style>

function clSave(){try{localStorage.setItem('sanabel_cloud',JSON.stringify({uid:CL.uid,ref:CL.ref,email:CL.email,me:CL.me,rev:CL.rev,snap:CL.snap,dirty:CL.dirty,lastOrd:CL.lastOrd,staff:CL.staff,setup:CL.setup,ph:CL.ph}))}catch(e){}}

/* Converting values to Firestore format and back */
function toV(v){if(v===null||v===undefined)return{nullValue:null};if(typeof v==='boolean')return{booleanValue:v};
if(typeof v==='number')return(isFinite(v)&&Math.floor(v)===v&&Math.abs(v)<9e15)?{integerValue:String(v)}:{doubleValue:isFinite(v)?v:0};
if(typeof v==='string')return{stringValue:v};if(Array.isArray(v))return{arrayValue:v.length?{values:v.map(toV)}:{}};
var f={};for(var k in v)if(v[k]!==undefined)f[k]=toV(v[k]);return{mapValue:{fields:f}}}
function fromV(x){if(!x)return null;if('nullValue' in x)return null;if('booleanValue' in x)return x.booleanValue;if('integerValue' in x)return+x.integerValue;if('doubleValue' in x)return x.doubleValue;
if('stringValue' in x)return x.stringValue;if('timestampValue' in x)return x.timestampValue;if('arrayValue' in x)return(x.arrayValue.values||[]).map(fromV);if('mapValue' in x)return fromF(x.mapValue.fields||{});return null}
function toF(o){var f={};for(var k in o)if(o[k]!==undefined)f[k]=toV(o[k]);return f}
function fromF(f){var o={};for(var k in f)o[k]=fromV(f[k]);return o}

/* Login and tokens */
function authMsg(m){m=String(m||'');if(/INVALID_PASSWORD|INVALID_LOGIN_CREDENTIALS|EMAIL_NOT_FOUND|USER_NOT_FOUND/.test(m))return'كلمة المرور غير صحيحة';
if(/TOO_MANY/.test(m))return'محاولات كثيرة، انتظر شوية وحاول مرة ثانية';if(/WEAK_PASSWORD/.test(m))return'كلمة المرور لازم 6 أحرف أو أكثر';if(/EMAIL_EXISTS/.test(m))return'الحساب موجود';
if(/OPERATION_NOT_ALLOWED|PASSWORD_LOGIN_DISABLED/.test(m))return'لازم تفعّل الدخول بالإيميل وكلمة المرور بـ Firebase';if(/USER_DISABLED/.test(m))return'الحساب موقوف';return'ما گدر يتصل بالسيرفر'+(m?' ('+m+')':'')}
function netErr(){var e=new Error('ماكو اتصال بالإنترنت');e.net=true;return e}
function authCall(ep,body){return fetch('https://identitytoolkit.googleapis.com/v1/accounts:'+ep+'?key='+FB.key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
.catch(function(){throw netErr()}).then(function(r){return r.json().then(function(j){if(!r.ok){var e=new Error(authMsg(j.error&&j.error.message));e.code=j.error&&j.error.message;throw e}return j})})}
function setTok(j){CL.uid=j.localId||CL.uid;CL.tok=j.idToken||j.id_token;CL.ref=j.refreshToken||j.refresh_token;CL.exp=Date.now()+(+(j.expiresIn||j.expires_in)||3600)*1000;clSave()}
function ensureTok(){if(CL.tok&&Date.now()<CL.exp-60000)return Promise.resolve(CL.tok);if(!CL.ref){var e0=new Error('no session');e0.auth=true;return Promise.reject(e0)}
return fetch('https://securetoken.googleapis.com/v1/token?key='+FB.key,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(CL.ref)})
.catch(function(){throw netErr()}).then(function(r){return r.json().then(function(j){if(!r.ok){var e=new Error(authMsg(j.error&&j.error.message));e.auth=true;throw e}setTok(j);return CL.tok})})}
function req(method,url,body,noAuth){function go(){var h={'Content-Type':'application/json'};if(!noAuth&&CL.tok)h.Authorization='Bearer '+CL.tok;
return fetch(url,{method:method,headers:h,body:body?JSON.stringify(body):undefined}).catch(function(){throw netErr()}).then(function(r){return r.text().then(function(t){var j={};try{j=t?JSON.parse(t):{}}catch(x){}
if(!r.ok){var e=new Error((j.error&&j.error.message)||('HTTP '+r.status));e.status=r.status;throw e}return j})})}
if(noAuth)return go();return ensureTok().then(go).catch(function(e){if(e.status===401){CL.exp=0;return ensureTok().then(go)}throw e})}
function dget(p,noAuth){return req('GET',FS_BASE+'/'+p,null,noAuth)}
function dset(p,o){return req('PATCH',FS_BASE+'/'+p,{fields:toF(o)})}
function ddel(p){return req('DELETE',FS_BASE+'/'+p)}
function dlist(c){var out=[];function page(t){return req('GET',FS_BASE+'/'+c+'?pageSize=200'+(t?'&pageToken='+encodeURIComponent(t):'')).then(function(j){(j.documents||[]).forEach(function(d){var o=fromF(d.fields||{});o.__id=d.name.split('/').pop();out.push(o)});return j.nextPageToken?page(j.nextPageToken):out})}return page()}
function dquery(c,f,gt){return req('POST',FS_BASE+':runQuery',{structuredQuery:{from:[{collectionId:c}],where:{fieldFilter:{field:{fieldPath:f},op:'GREATER_THAN',value:toV(gt)}}}})
.then(function(a){return(a||[]).filter(function(x){return x.document}).map(function(x){var o=fromF(x.document.fields||{});o.__id=x.document.name.split('/').pop();return o})})}
function dinc(p,fields){return req('POST',FS_BASE+':commit',{writes:[{transform:{document:FS_DOC+'/'+p,fieldTransforms:fields.map(function(f){return{fieldPath:f,increment:{integerValue:'1'}}})}}]})
.then(function(j){var r=(j.writeResults&&j.writeResults[0]&&j.writeResults[0].transformResults)||[];return r.map(function(x){return+fromV(x)})})}
function dmax(p,f,val){return req('POST',FS_BASE+':commit',{writes:[{transform:{document:FS_DOC+'/'+p,fieldTransforms:[{fieldPath:f,maximum:{integerValue:String(val)}}]}}]})}
function nextSeq(){return dinc('meta/counter',['seq']).then(function(r){return r[0]})}

/* Building documents from the app data */
var CFG_KEYS=['slogan','cur','ac','bg','font','rad','lh','ratio','fit','view','auto','sec','orderOn','addons','fills','fillReq','prn','rcNote','logo','lockMin'];
function cfgObj(){var o={};CFG_KEYS.forEach(function(k){if(S[k]!==undefined&&S[k]!==null)o[k]=S[k]});return o}
function ordObj(o){var x={};for(var k in o)if(k!=='photo'&&k!=='morePh'&&k!=='upd'&&k!=='id'&&o[k]!==undefined)x[k]=o[k];return x}
function docsFromS(){var D={'config/main':cfgObj()};
S.cats.forEach(function(c,i){D['cats/'+c.id]={name:c.name,o:i,cover:c.cover||''};c.imgs.forEach(function(m,j){D['items/'+m.id]={cat:c.id,o:j,cap:m.cap||'',desc:m.desc||'',sizes:m.sizes||[],src:m.src||''}})});
S.orders.forEach(function(o){D['orders/'+o.id]=ordObj(o)});return D}
function hsh(s){return hx(s)+'.'+s.length}
function clKind(p){return p.indexOf('orders/')===0?'ord':p.indexOf('config/')===0?'cfg':'cat'}

/* Detect changes and upload them */
var clT=null;
function cloudDirty(){if(!CL.uid||!CL.ready||CL.quiet)return;clearTimeout(clT);clT=setTimeout(clDiff,450)}
function clDiff(){if(!CL.uid||!CL.ready)return;var D=docsFromS(),now=Date.now(),ch={};
for(var p in D){var h=hsh(JSON.stringify(D[p]));if(CL.snap[p]!==h){if(p.indexOf('orders/')===0){var o=findO(p.slice(7));if(o)o.upd=now}CL.snap[p]=h;CL.dirty[p]='set';ch[clKind(p)]=1}}
for(var q in CL.snap)if(!(q in D)){var k=clKind(q);if(k==='cfg')continue;delete CL.snap[q];CL.dirty[q]=k==='ord'?'tomb':'del';ch[k]=1}
for(var r in ch)CL.dirty['rev#'+r]='rev';clSave();if(ch.ord)quietSave();clFlush()}
function clFlush(){if(CL.busy||!CL.uid||!CL.ref||!CL.ready)return;var keys=Object.keys(CL.dirty);if(!keys.length){clStatus();return}CL.busy=true;clStatus();
var D=docsFromS(),list=keys.filter(function(k){return CL.dirty[k]!=='rev'}),i=0;
function next(){if(i>=list.length)return doRev();var p=list[i++],op=CL.dirty[p],pr;
if(op==='del')pr=ddel(p);else if(op==='tomb')pr=dset(p,{del:true,upd:Date.now()});
else if(op==='photo')pr=phGet('o_'+p.split('/')[1]).then(function(src){return src?dset(p,{d:src}):null});
else{var f=D[p];if(!f){delete CL.dirty[p];return next()}if(p.indexOf('orders/')===0){var o=findO(p.slice(7));f=ordObj(o);f.upd=o.upd||Date.now();if(o.offNo){var on=o.no;pr=dset(p,f).then(function(){return dmax('meta/counter','seq',on)})}else pr=dset(p,f)}else pr=dset(p,f)}
return pr.then(function(){delete CL.dirty[p];clSave();return next()}).catch(function(e){
if(e.status===404&&op==='del'){delete CL.dirty[p];return next()}
if(e.status===403||e.status===400){delete CL.dirty[p];clSave();toast(e.status===403?'ما عندك صلاحية تحفظ هذا التعديل بالسيرفر':'تعذر رفع تعديل (ممكن الصورة كبيرة)');return next()}throw e})}
function doRev(){var f=Object.keys(CL.dirty).filter(function(k){return CL.dirty[k]==='rev'}).map(function(k){return k.slice(4)});if(!f.length)return Promise.resolve();
return dinc('meta/rev',f).then(function(res){f.forEach(function(k,j){delete CL.dirty['rev#'+k];if(res[j]===(CL.rev[k]||0)+1)CL.rev[k]=res[j]});clSave()})}
next().then(function(){CL.busy=false;CL.online=true;clStatus();if(Object.keys(CL.dirty).length)setTimeout(clFlush,400)}).catch(function(e){CL.busy=false;CL.online=!e.net;clStatus();if(e.auth&&!e.net)clAuthLost()})}

/* Fetching changes from the server */
function quietSave(){CL.quiet=true;try{save()}finally{CL.quiet=false}}
function resnap(re){var D=docsFromS();for(var p in CL.snap)if(re.test(p)&&!(p in D))delete CL.snap[p];for(var q in D)if(re.test(q))CL.snap[q]=hsh(JSON.stringify(D[q]))}
var pendRender=false;
function liveRender(){var a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&v==='admin'){pendRender=true;return}if(!$('#dlg').hidden){pendRender=true;return}if(v==='admin'||v==='show'||v==='home')render()}
document.addEventListener('focusout',function(){if(pendRender)setTimeout(function(){var a=document.activeElement;if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))&&$('#dlg').hidden){pendRender=false;render()}},300)});
function pullCatalog(force){return Promise.all([dlist('cats'),dlist('items'),dget('config/main').catch(function(e){if(e.status===404)return null;throw e})]).then(function(res){
if(!force&&Object.keys(CL.dirty).some(function(k){return/^(cats|items|config)\//.test(k)}))return;
var items=res[1];S.cats=res[0].sort(function(a,b){return a.o-b.o}).map(function(c){var x={id:c.__id,name:c.name,imgs:items.filter(function(m){return m.cat===c.__id}).sort(function(a,b){return a.o-b.o}).map(function(m){return{id:m.__id,cap:m.cap,desc:m.desc,sizes:m.sizes||[],src:m.src}})};if(c.cover)x.cover=c.cover;return x});
if(res[2]){var c=fromF(res[2].fields||{});CFG_KEYS.forEach(function(k){if(k in c)S[k]=c[k]})}
mig();resnap(/^(cats|items|config)\//);clSave();quietSave();liveRender()})}
function pullOrders(){return dquery('orders','upd',CL.lastOrd||0).then(function(list){var mx=CL.lastOrd||0;
list.forEach(function(r){mx=Math.max(mx,r.upd||0);var id=r.__id;delete r.__id;if(CL.dirty['orders/'+id])return;var i=-1;S.orders.forEach(function(x,k){if(x.id===id)i=k});
if(r.del){if(i>=0)S.orders.splice(i,1);delete CL.snap['orders/'+id];return}r.id=id;
if(i>=0){if((S.orders[i].upd||0)>(r.upd||0))return;var ph=S.orders[i].photo;S.orders[i]=r;if(ph)r.photo=ph}else S.orders.push(r);CL.snap['orders/'+id]=hsh(JSON.stringify(ordObj(r)))});
S.orders.sort(function(a,b){return b.at-a.at});S.orders.forEach(function(o){if(+o.no>=S.seq)S.seq=+o.no+1});CL.lastOrd=mx;clSave();quietSave();if(list.length)liveRender()})}
function pullStaff(){return dget('public/staff',true).then(function(d){CL.staff=(fromF(d.fields||{}).list)||[];if(curU){var me=CL.staff.filter(function(u){return u.uid===curU.id})[0];if(me&&(me.r!==curU.r||me.n!==curU.n)){curU.r=me.r;curU.n=me.n;CL.me={n:me.n,r:me.r}}}clSave()}).catch(function(e){if(e.status===404){CL.staff=[];return}throw e})}
function clPoll(){if(!CL.uid||!CL.ref||!CL.ready||CL.pulling)return;CL.pulling=true;
dget('meta/rev').then(function(d){var r=fromF(d.fields||{}),jobs=[];
if((r.cat||0)!==(CL.rev.cat||0)||(r.cfg||0)!==(CL.rev.cfg||0))jobs.push(pullCatalog().then(function(){CL.rev.cat=r.cat||0;CL.rev.cfg=r.cfg||0}));
if((r.ord||0)!==(CL.rev.ord||0))jobs.push(pullOrders().then(function(){CL.rev.ord=r.ord||0}));
if((r.usr||0)!==(CL.rev.usr||0))jobs.push(pullStaff().then(function(){CL.rev.usr=r.usr||0;if(v==='admin'&&tab==='usr')liveRender()}));
return Promise.all(jobs)}).catch(function(e){if(e.status===404)return;throw e})
.then(function(){CL.pulling=false;CL.online=true;clSave();clStatus()}).catch(function(e){CL.pulling=false;CL.online=!e.net;clStatus();if(e.auth&&!e.net)clAuthLost()})}
function pullAll(){CL.syncing=true;return pullStaff().then(function(){return dget('meta/rev').then(function(d){return fromF(d.fields||{})}).catch(function(){return{}})}).then(function(r){
CL.lastOrd=0;return pullCatalog(true).then(function(){return pullOrders()}).then(function(){CL.rev={cat:r.cat||0,cfg:r.cfg||0,ord:r.ord||0,usr:r.usr||0};CL.syncing=false;clSave()})}).catch(function(e){CL.syncing=false;throw e})}

/* The QR window on the tablet */
var QS=null;
function upURL(){if(/^https?:/.test(location.protocol)&&!/localhost|127\.0\.0\.1/.test(location.host))return location.origin+location.pathname.replace(/[^\/]*$/,'')+'up.html';return'https://raadaljnabi.github.io/sanabel-panel/up.html'}
function tok(){var a='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789',r='',u=new Uint32Array(24);(window.crypto||window.msCrypto).getRandomValues(u);for(var i=0;i<24;i++)r+=a[u[i]%a.length];return r}
function qrOpen(){var left=PH_MAX-phL().length;if(left<=0)return toast('وصلت للحد');if(!CL.uid||!CL.ready)return toast('هذي الميزة تحتاج تسجيل دخول وإنترنت');if(!CL.online)return toast('ماكو إنترنت هسه، ارفع الصورة من الجهاز');
var k=tok(),exp=Date.now()+10*60000;QS={k:k,exp:exp,busy:false,t:null};
var m=$('#qrm');if(!m){m=document.createElement('div');m.id='qrm';document.body.appendChild(m)}m.hidden=false;
m.innerHTML='<div class="qrb"><h3>صورة من موبايل الزبون</h3><p class="mut">جاري تجهيز الكود...</p></div>';
dset('qr/'+k,{st:'wait',exp:exp,max:left,n:0,at:Date.now(),by:meN()}).then(function(){if(!QS||QS.k!==k)return;var url=upURL()+'?k='+k;
m.innerHTML='<div class="qrb"><h3>📱 صورة من موبايل الزبون</h3><div class="qrc">'+QR.svg(url,250)+'</div><ol class="qrs"><li>الزبون يفتح <b>الكاميرا</b> بموبايله ويوجّهها على الكود</li><li>يضغط الرابط ويختار '+(left>1?'لحد '+left+' صور':'الصورة')+'</li><li>الصور توصل هنا لوحدها</li></ol>'+
'<div class="qrw" id="qrw"><span class="spin sm"></span> بانتظار صور الزبون... <b id="qrt"></b></div><div class="row" style="justify-content:center;gap:8px;margin-top:12px"><button class="ib" data-a="qrx">إلغاء</button></div></div>';
qrTick();QS.t=setInterval(qrTick,2000)}).catch(function(e){qrClose(false);toast(e.status===403?'لازم تحدّث «قواعد الحماية» بـ Firebase حتى تشتغل هذي الميزة':'ما گدر يسوي الكود: '+(e.message||''))})}
function qrTick(){if(!QS)return;var s=Math.max(0,Math.round((QS.exp-Date.now())/1000)),t=$('#qrt');if(t)t.textContent=Math.floor(s/60)+':'+pad(s%60);
if(s<=0){clearInterval(QS.t);var w=$('#qrw');if(w)w.innerHTML='<b class="late">انتهت صلاحية الكود</b> <button class="pri sm" data-a="qrnew">كود جديد</button>';return}
if(QS.busy)return;QS.busy=true;var k=QS.k;
dget('qr/'+k).then(function(d){var x=fromF(d.fields||{});if(x.st!=='done'){if(QS)QS.busy=false;return}
var w=$('#qrw');if(w)w.innerHTML='<span class="spin sm"></span> وصلت! جاري التحميل...';var n=Math.min(3,+x.n||1),jobs=[];
for(var i=0;i<n;i++)jobs.push(dget('qrp/'+k+'_'+i).then(function(p){return fromF(p.fields||{}).d||null}).catch(function(){return null}));
return Promise.all(jobs).then(function(L){L=L.filter(Boolean);if(!QS||QS.k!==k)return;
if(PD&&PD.step!=='rc'){phSet(phL().concat(L));drawPD()}
clearInterval(QS.t);qrClean(k,n);QS=null;var m=$('#qrm');if(m)m.hidden=true;chime();toast(L.length>1?'وصلت '+L.length+' صور ✓':'وصلت الصورة ✓')})}).catch(function(){if(QS)QS.busy=false})}
function qrClean(k,n){for(var i=0;i<(n||3);i++)ddel('qrp/'+k+'_'+i).catch(function(){});ddel('qr/'+k).catch(function(){})}
function qrClose(clean){if(QS){clearInterval(QS.t);if(clean)qrClean(QS.k,3);QS=null}var m=$('#qrm');if(m)m.hidden=true}
