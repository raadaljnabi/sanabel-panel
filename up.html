<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>رفع صورة الكيكة</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--ac:#b9792b;--bg:#fbf3e4}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;color:#3b2a2a;font-family:Tajawal,Tahoma,"Segoe UI",Arial,sans-serif}
body{background:radial-gradient(1200px 600px at 50% -200px,color-mix(in srgb,var(--ac) 22%,var(--bg)),var(--bg))}
.w{max-width:480px;margin:0 auto;padding:30px 18px 40px;min-height:100vh;display:flex;flex-direction:column;align-items:center;text-align:center}
.lgw{position:relative;width:104px;height:104px;animation:drop .7s cubic-bezier(.2,1.4,.4,1) both}.lgw::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:conic-gradient(from 0deg,var(--ac),transparent 60%,var(--ac));opacity:.35;animation:spin 6s linear infinite}
.lg{position:relative;width:104px;height:104px;border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.12);border:4px solid #fff}
h1{font-size:24px;margin:18px 0 2px;animation:up .5s .1s both}.sub{color:#8a7474;margin:0 0 20px;line-height:1.7;animation:up .5s .18s both}
.steps{display:flex;gap:8px;justify-content:center;margin:0 0 16px;animation:up .5s .24s both}.steps span{display:flex;align-items:center;gap:6px;font-size:13px;color:#8a7474;background:#fff;padding:6px 12px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.05)}.steps b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#eee;color:#666;font-size:12px}.steps .on{color:#3b2a2a;font-weight:700}.steps .on b{background:var(--ac);color:#fff}
.card{width:100%;background:#fff;border-radius:24px;padding:20px;box-shadow:0 14px 40px rgba(80,50,20,.12);animation:up .55s .3s both}
.pick{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:28px 12px;border:2px dashed color-mix(in srgb,var(--ac) 45%,#fff);border-radius:20px;background:color-mix(in srgb,var(--ac) 6%,#fff);color:var(--ac);font:inherit;font-size:18px;font-weight:800;cursor:pointer;transition:transform .15s}.pick:active{transform:scale(.97)}
.pick .ic{font-size:44px;animation:float 2.4s ease-in-out infinite}.pick small{font-weight:400;color:#9a8a7a;font-size:13px}
.th{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 4px}.th div{position:relative;animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}.th img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.th button{position:absolute;top:-8px;left:-8px;width:28px;height:28px;border-radius:50%;border:0;background:#d64545;color:#fff;font-size:14px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.th .pr{position:absolute;inset:auto 8px 8px;height:6px;border-radius:9px;background:rgba(255,255,255,.7);overflow:hidden}.th .pr i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}.th .ok{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;background:rgba(255,255,255,.55);border-radius:16px;animation:pop .3s both}
.go{width:100%;margin-top:16px;padding:16px;border:0;border-radius:18px;background:var(--ac);color:#fff;font:inherit;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 10px 24px color-mix(in srgb,var(--ac) 40%,transparent);transition:transform .15s}.go:active{transform:scale(.97)}.go:disabled{opacity:.6}
.msg{font-size:18px;line-height:1.8;margin:6px 0}.err{color:#c03030}.mut{color:#8a7474;font-size:14px;line-height:1.7}
.done{position:relative;width:96px;height:96px;margin:6px auto 10px}.done circle{fill:none;stroke:var(--ac);stroke-width:6;stroke-dasharray:283;stroke-dashoffset:283;animation:draw .6s ease-out forwards}.done path{fill:none;stroke:var(--ac);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80;animation:draw .35s .55s ease-out forwards}
.cf{position:fixed;top:-10px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards;z-index:9}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid color-mix(in srgb,var(--ac) 20%,#fff);border-top-color:var(--ac);animation:spin .8s linear infinite;margin:20px auto}
.ft{margin-top:auto;padding-top:26px;color:#a99;font-size:12px}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes drop{from{opacity:0;transform:translateY(-30px) scale(.8)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-6px)}}@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="w">
<div class="lgw"><img class="lg" id="lg" src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20200%20200%22%3E%3Ccircle%20cx%3D%22100%22%20cy%3D%22100%22%20r%3D%2296%22%20fill%3D%22%23fdf6e8%22/%3E%3Ccircle%20cx%3D%22100%22%20cy%3D%22100%22%20r%3D%2289%22%20fill%3D%22none%22%20stroke%3D%22%23c99a3e%22%20stroke-width%3D%224%22/%3E%3Cpath%20d%3D%22M29%20152%20Q100%20133%20171%20152%20A88%2088%200%200%201%2029%20152Z%22%20fill%3D%22%23ecc96f%22/%3E%3Cg%20transform%3D%22translate%2846%20152%29%20rotate%28-12%29%20scale%281%201%29%22%3E%3Cg%3E%3Cpath%20d%3D%22M0%200%20Q-3%20-40%200%20-76%22%20fill%3D%22none%22%20stroke%3D%22%23c8902e%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M0%20-12%20Q-16%20-22%20-20%20-42%20Q-6%20-30%200%20-19Z%22%20fill%3D%22%23b9812f%22/%3E%3Cellipse%20cx%3D%22-6%22%20cy%3D%22-30%22%20rx%3D%224.6%22%20ry%3D%229%22%20transform%3D%22rotate%28-28%20-6%20-30%29%22%20fill%3D%22%23d9a441%22/%3E%3Cellipse%20cx%3D%226%22%20cy%3D%22-30%22%20rx%3D%224.6%22%20ry%3D%229%22%20transform%3D%22rotate%2828%206%20-30%29%22%20fill%3D%22%23d9a441%22/%3E%3Cellipse%20cx%3D%22-6%22%20cy%3D%22-42%22%20rx%3D%224.6%22%20ry%3D%229%22%20transform%3D%22rotate%28-28%20-6%20-42%29%22%20fill%3D%22%23d9a441%22/%3E%3Cellipse%20cx%3D%226%22%20cy%3D%22-42%22%20rx%3D%224.6%22%20ry%3D%229%22%20transform%3D%22rotate%2828%206%20-42%29%22%20fill%3D%22%23d9a441%22/%3E%3Cellipse%20cx%3D%22-6%22%20cy%3D%22-54%22%20rx%3D%224.6%22%20ry%3D%229%22%20transform%3D%22rotate%28-28%20-6%20-54%29%22%20fill%3D%22%23d9a441%22/%3E%3Cellipse%20cx%3D%226%22%20cy%3D%22-54%22%20rx%3D%224.6%22%20ry%3D%229%22%20transform%3D%22rotate%2828%206%20-54%29%22%20fill%3D%22%23d9a441%22/%3E%3Cellipse%20cx%3D%22-6%22%20cy%3D%22-66%22%20rx%3D%224.6%22%20ry%3D%229%22%20transform%3D%22rotate%28-28%20-6%20-66%29%22%20fill%3D%22%23d9a441%22/%3E%3Cellipse%20cx%3D%226%22%20cy%3D%22-66%22%20rx%3D%224.6%22%20ry%3D%229%22%20transform%3D%22rotate%2828%206%20-66%29%22%20fill%3D%22%23d9a441%22/%3E%3Cellipse%20cx%3D%220%22%20cy%3D%22-79%22%20rx%3D%224.6%22%20ry%3D%229%22%20transform%3D%22rotate%280%200%20-79%29%22%20fill%3D%22%23d9a441%22/%3E%3C/g%3E%3C/g%3E%3Cg%20transform%3D%22translate%28154%20152%29%20rotate%2812%29%20scale%28-1%201%29%22%3E%3Cg%3E%3Cpath%20d%3D%22M0%200%20Q-3%20-40%200%20-76%22%20fill%3D%22none%22%20stroke%3D%22%23c8902e%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M0%20-12%20Q-16%20-22%20-20%20-42%20Q-6%20-30%200%20-19Z%22%20fill%3D%22%23b9812f%22/%3E%3Cellipse%20cx%3D%22-6%22%20cy%3D%22-30%22%20rx%3D%224.6%22%20ry%3D%229%22%20transform%3D%22rotate%28-28%20-6%20-30%29%22%20fill%3D%22%23d9a441%22/%3E%3Cellipse%20cx%3D%226%22%20cy%3D%22-30%22%20rx%3D%224.6%22%20ry%3D%229%22%20transform%3D%22rotate%2828%206%20-30%29%22%20fill%3D%22%23d9a441%22/%3E%3Cellipse%20cx%3D%22-6%22%20cy%3D%22-42%22%20rx%3D%224.6%22%20ry%3D%229%22%20transform%3D%22rotate%28-28%20-6%20-42%29%22%20fill%3D%22%23d9a441%22/%3E%3Cellipse%20cx%3D%226%22%20cy%3D%22-42%22%20rx%3D%224.6%22%20ry%3D%229%22%20transform%3D%22rotate%2828%206%20-42%29%22%20fill%3D%22%23d9a441%22/%3E%3Cellipse%20cx%3D%22-6%22%20cy%3D%22-54%22%20rx%3D%224.6%22%20ry%3D%229%22%20transform%3D%22rotate%28-28%20-6%20-54%29%22%20fill%3D%22%23d9a441%22/%3E%3Cellipse%20cx%3D%226%22%20cy%3D%22-54%22%20rx%3D%224.6%22%20ry%3D%229%22%20transform%3D%22rotate%2828%206%20-54%29%22%20fill%3D%22%23d9a441%22/%3E%3Cellipse%20cx%3D%22-6%22%20cy%3D%22-66%22%20rx%3D%224.6%22%20ry%3D%229%22%20transform%3D%22rotate%28-28%20-6%20-66%29%22%20fill%3D%22%23d9a441%22/%3E%3Cellipse%20cx%3D%226%22%20cy%3D%22-66%22%20rx%3D%224.6%22%20ry%3D%229%22%20transform%3D%22rotate%2828%206%20-66%29%22%20fill%3D%22%23d9a441%22/%3E%3Cellipse%20cx%3D%220%22%20cy%3D%22-79%22%20rx%3D%224.6%22%20ry%3D%229%22%20transform%3D%22rotate%280%200%20-79%29%22%20fill%3D%22%23d9a441%22/%3E%3C/g%3E%3C/g%3E%3Cpath%20d%3D%22M86%20152%20L114%20152%20L108%2088%20L92%2088Z%22%20fill%3D%22%238a5a2b%22/%3E%3Cpath%20d%3D%22M96%20152%20L96%20140%20A4%204%200%200%201%20104%20140%20L104%20152Z%22%20fill%3D%22%235c3a1a%22/%3E%3Ccircle%20cx%3D%22100%22%20cy%3D%22112%22%20r%3D%224%22%20fill%3D%22%23f6dc9a%22/%3E%3Cpath%20d%3D%22M88%2090%20L112%2090%20L100%2074Z%22%20fill%3D%22%236b4220%22/%3E%3Cg%20transform%3D%22translate%28100%2080%29%22%3E%3Cg%3E%3Cpath%20d%3D%22M-4%20-6%20L4%20-6%20L7%20-44%20L-7%20-44Z%22%20transform%3D%22rotate%2845%29%22%20fill%3D%22%23f1c35c%22%20stroke%3D%22%238a5a2b%22%20stroke-width%3D%222%22%20stroke-linejoin%3D%22round%22/%3E%3Cpath%20d%3D%22M-4%20-6%20L4%20-6%20L7%20-44%20L-7%20-44Z%22%20transform%3D%22rotate%28135%29%22%20fill%3D%22%23f1c35c%22%20stroke%3D%22%238a5a2b%22%20stroke-width%3D%222%22%20stroke-linejoin%3D%22round%22/%3E%3Cpath%20d%3D%22M-4%20-6%20L4%20-6%20L7%20-44%20L-7%20-44Z%22%20transform%3D%22rotate%28225%29%22%20fill%3D%22%23f1c35c%22%20stroke%3D%22%238a5a2b%22%20stroke-width%3D%222%22%20stroke-linejoin%3D%22round%22/%3E%3Cpath%20d%3D%22M-4%20-6%20L4%20-6%20L7%20-44%20L-7%20-44Z%22%20transform%3D%22rotate%28315%29%22%20fill%3D%22%23f1c35c%22%20stroke%3D%22%238a5a2b%22%20stroke-width%3D%222%22%20stroke-linejoin%3D%22round%22/%3E%3Ccircle%20r%3D%225%22%20fill%3D%22%235c3a1a%22/%3E%3C/g%3E%3C/g%3E%3C/svg%3E" alt=""></div><h1 id="shop">سنابل الطاحونة</h1><p class="sub">ارفع صورة الكيكة اللي تريدها، وتوصل للكاشير مباشرة 🎂</p>
<div class="steps"><span class="on" id="s1"><b>1</b>اختار</span><span id="s2"><b>2</b>أرسل</span><span id="s3"><b>3</b>تم</span></div>
<div class="card" id="c"><div class="spin"></div></div><div class="ft">تصميم وتطوير Meras Tech</div></div>
<input type="file" id="f" accept="image/*" multiple hidden>
<script>
var KEY='AIzaSyA1nLRob4JDF8k1FtPqH5rV7Ce0hE53RbU',BASE='https://firestore.googleapis.com/v1/projects/sanabel-cake/databases/(default)/documents/';
var k=(location.search.match(/[?&]k=([A-Za-z0-9]{20,})/)||[])[1],MAX=3,P=[],busy=false,c=document.getElementById('c'),f=document.getElementById('f');
function show(h){c.innerHTML=h}function step(n){[1,2,3].forEach(function(i){document.getElementById('s'+i).className=i<=n?'on':''})}
function bad(m){show('<div style="font-size:54px">⏱️</div><p class="msg err">'+m+'</p><p class="mut">اطلب من الكاشير يطلّعلك كود جديد.</p>')}
function req(m,p,b){return fetch(BASE+p+(p.indexOf('?')<0?'?':'&')+'key='+KEY,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}).then(function(r){if(!r.ok){var e=new Error('HTTP '+r.status);e.status=r.status;throw e}return r.json()})}
function shrink(file,mx,q){return new Promise(function(ok,no){var r=new FileReader();r.onerror=no;r.onload=function(){var im=new Image();im.onerror=function(){no(new Error('img'))};im.onload=function(){var s=Math.min(1,mx/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);var g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(im,0,0,cv.width,cv.height);ok(cv.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(file)})}
function fit(file){return shrink(file,1280,.78).then(function(d){return d.length<900000?d:shrink(file,900,.7)})}
function draw(){step(P.length?2:1);show((P.length<MAX?'<button class="pick" id="pk"><span class="ic">📷</span>'+(P.length?'إضافة صورة ثانية':'اختار الصورة')+'<small>تكدر ترفع لحد '+MAX+(MAX>1?' صور':' صورة')+' · من المعرض أو الكاميرة</small></button>':'')+
(P.length?'<div class="th">'+P.map(function(s,i){return'<div><img src="'+s+'" alt=""><button data-i="'+i+'" aria-label="حذف">✕</button></div>'}).join('')+'</div><button class="go" id="go">إرسال '+(P.length>1?'الصور ('+P.length+')':'الصورة')+' ←</button>':''))}
c.addEventListener('click',function(e){if(busy)return;var t=e.target.closest('button');if(!t)return;if(t.id==='pk')f.click();else if(t.id==='go')send();else if(t.dataset.i!=null){P.splice(+t.dataset.i,1);draw()}});
f.addEventListener('change',function(){var L=[].slice.call(f.files).slice(0,MAX-P.length);f.value='';if(!L.length)return;show('<div class="spin"></div><p class="mut">جاري تجهيز الصور...</p>');
Promise.all(L.map(fit)).then(function(a){P=P.concat(a).slice(0,MAX);draw()}).catch(function(){draw();alert('ما گدرنا نقرأ الصورة، جرّب صورة ثانية')})});
function confetti(){var cols=[getComputedStyle(document.documentElement).getPropertyValue('--ac')||'#b9792b','#f6c445','#e84a7f','#4cc38a','#5b8def'];for(var i=0;i<40;i++){var d=document.createElement('i');d.className='cf';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];d.style.animationDuration=(1.6+Math.random()*1.6)+'s';d.style.animationDelay=(Math.random()*.4)+'s';document.body.appendChild(d);setTimeout(function(x){return function(){x.remove()}}(d),3800)}}
function send(){busy=true;var i=0;step(2);show('<p class="msg">جاري الإرسال...</p><div class="th">'+P.map(function(s,j){return'<div><img src="'+s+'" alt=""><span class="pr"><i id="pb'+j+'"></i></span></div>'}).join('')+'</div>');
function next(){if(i>=P.length)return req('PATCH','qr/'+k+'?updateMask.fieldPaths=st&updateMask.fieldPaths=n',{fields:{st:{stringValue:'done'},n:{integerValue:String(P.length)}}});
var b=document.getElementById('pb'+i);if(b)b.style.width='60%';
return req('PATCH','qrp/'+k+'_'+i,{fields:{d:{stringValue:P[i]},k:{stringValue:k}}}).then(function(){var b2=document.getElementById('pb'+i);if(b2){b2.style.width='100%';b2.parentNode.insertAdjacentHTML('afterend','<span class="ok">✅</span>')}i++;return next()})}
next().then(function(){step(3);show('<svg class="done" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45"/><path d="M30 52l13 13 27-29"/></svg><p class="msg"><b>تم!</b><br>وصلت '+(P.length>1?'الصور':'الصورة')+' للكاشير</p><p class="mut">تكدر تسكّر هالصفحة، والكاشير يكمل الحجز 🎂</p>');confetti()})
.catch(function(e){busy=false;if(e.status===403||e.status===404)bad('انتهت صلاحية هذا الكود');else{draw();alert('ما گدرنا نرسل. تأكد من الإنترنت وجرّب مرة ثانية')}})}
if(!k)bad('الرابط غير صحيح');else req('GET','qr/'+k).then(function(d){var x=d.fields||{},st=(x.st||{}).stringValue;MAX=Math.max(1,Math.min(3,+((x.max||{}).integerValue||3)));
var lg=(x.logo||{}).stringValue,ac=(x.ac||{}).stringValue,sh=(x.shop||{}).stringValue;if(lg&&/^data:image/.test(lg))document.getElementById('lg').src=lg;
if(ac&&/^#[0-9a-fA-F]{3,8}$/.test(ac))document.documentElement.style.setProperty('--ac',ac);if(sh){document.getElementById('shop').textContent=sh;document.title=sh+' · رفع صورة الكيكة'}
if(st!=='wait')return bad('هذا الكود انستخدم قبل');draw()}).catch(function(e){if(e.status===404||e.status===403)bad('انتهت صلاحية هذا الكود');else show('<div style="font-size:50px">📶</div><p class="msg err">ماكو إنترنت</p><p class="mut">شغّل الإنترنت وحدّث الصفحة.</p>')});
</script></body></html>
