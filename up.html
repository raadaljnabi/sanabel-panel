<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سنابل الطاحونة · رفع صورة الكيكة</title><meta name="robots" content="noindex">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fbf3e4;color:#3b2a2a;font-family:Tahoma,"Segoe UI",Arial,sans-serif}
.w{max-width:460px;margin:0 auto;padding:28px 18px 40px;min-height:100vh;display:flex;flex-direction:column;align-items:center;text-align:center}
.lg{width:92px;height:92px;border-radius:50%;box-shadow:0 8px 24px rgba(120,80,20,.18)}h1{font-size:22px;margin:14px 0 4px}.sub{color:#8a7474;margin:0 0 22px;line-height:1.7}
.card{width:100%;background:#fff;border-radius:22px;padding:20px;box-shadow:0 10px 30px rgba(120,80,20,.1)}
.pick{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;padding:26px 12px;border:2px dashed #e2c89a;border-radius:18px;background:#fffaf0;color:#8a5a14;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
.pick span{font-size:40px}.pick small{font-weight:400;color:#9a8a7a;font-size:13px}
.th{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0 4px}.th div{position:relative}.th img{width:92px;height:92px;object-fit:cover;border-radius:14px;border:2px solid #f0dcc0}
.th button{position:absolute;top:-8px;left:-8px;width:28px;height:28px;border-radius:50%;border:0;background:#d64545;color:#fff;font-size:15px;cursor:pointer}
.go{width:100%;margin-top:16px;padding:16px;border:0;border-radius:16px;background:#b9792b;color:#fff;font:inherit;font-size:18px;font-weight:800;cursor:pointer}.go:disabled{opacity:.5}
.msg{font-size:18px;line-height:1.8}.ok{font-size:64px;margin:6px 0}.err{color:#c03030}.mut{color:#8a7474;font-size:14px;line-height:1.7}
.bar{height:8px;border-radius:9px;background:#f2e6d3;overflow:hidden;margin-top:14px}.bar i{display:block;height:100%;width:0;background:#b9792b;transition:width .3s}
.ft{margin-top:auto;padding-top:26px;color:#a99;font-size:12px}
</style></head><body><div class="w">

29%22%20fill%3D%22%23d9a441%22/%3E%3Cellipse%20cx%3D%220%22%20cy%3D%22-79%22%20rx%3D%224.6%22%20ry%3D%229%22%20transform%3D%22rotate%280%200%20-79%29%22%20fill%3D%22%23d9a441%22/%3E%3C/g%3E%3C/g%3E%3Cg%20transform%3D%22translate%28154%20152%29%20rotate%2812%29%20scale%28-1%201%29%22%3E%3Cg%3E%3Cpath%20d%3D%22M0%200%20Q-3%20-40%200%20-76%22%20fill%3D%22none%22%20stroke%3D%22%23c8902e%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M0%20-12%20Q-16%20-22%20-20%20-42%20Q-6%20-30%200%20-19Z%22%20fill%3D%22%23b9812f%22/%3E%3Cellipse%20cx%3D%22-6%22%20cy%3D%22-30%22%20rx%3D%224.6%22%20ry%3D%229%22%20transform%3D%22rotate%28-28%20-6%20-30%29%22%20fill%3D%22%23d9a441%22/%3E%3Cellipse%20cx%3D%226%22%20cy%3D%22-30%22%20rx%3D%224.6%22%20ry%3D%229%22%20transform%3D%22rotate%2828%206%20-30%29%22%20fill%3D%22%23d9a441%22/%3E%3Cellipse%20cx%3D%22-6%22%20cy%3D%22-42%22%20rx%3D%224.6%22%20ry%3D%229%22%20transform%3D%22rotate%28-28%20-6%20-42%29%22%20fill%3D%22%23d9a441%22/%3E%3Cellipse%20cx%3D%226%22%20cy%3D%22-42%22%20rx%3D%224.6%22%20ry%3D%229%22%20transform%3D%22rotate%2828%206%20-42%29%22%20fill%3D%22%23d9a441%22/%3E%3Cellipse%20cx%3D%22-6%22%20cy%3D%22-54%22%20rx%3D%224.6%22%20ry%3D%229%22%20transform%3D%22rotate%28-28%20-6%20-54%29%22%20fill%3D%22%23d9a441%22/%3E%3Cellipse%20cx%3D%226%22%20cy%3D%22-54%22%20rx%3D%224.6%22%20ry%3D%229%22%20transform%3D%22rotate%2828%206%20-54%29%22%20fill%3D%22%23d9a441%22/%3E%3Cellipse%20cx%3D%22-6%22%20cy%3D%22-66%22%20rx%3D%224.6%22%20ry%3D%229%22%20transform%3D%22rotate%28-28%20-6%20-66%29%22%20fill%3D%22%23d9a441%22/%3E%3Cellipse%20cx%3D%226%22%20cy%3D%22-66%22%20rx%3D%224.6%22%20ry%3D%229%22%20transform%3D%22rotate%2828%206%20-66%29%22%20fill%3D%22%23d9a441%22/%3E%3Cellipse%20cx%3D%220%22%20cy%3D%22-79%22%20rx%3D%224.6%22%20ry%3D%229%22%20transform%3D%22rotate%280%200%20-79%29%22%20fill%3D%22%23d9a441%22/%3E%3C/g%3E%3C/g%3E%3Cpath%20d%3D%22M86%20152%20L114%20152%20L108%2088%20L92%2088Z%22%20fill%3D%22%238a5a2b%22/%3E%3Cpath%20d%3D%22M96%20152%20L96%20140%20A4%204%200%200%201%20104%20140%20L104%20152Z%22%20fill%3D%22%235c3a1a%22/%3E%3Ccircle%20cx%3D%22100%22%20cy%3D%22112%22%20r%3D%224%22%20fill%3D%22%23f6dc9a%22/%3E%3Cpath%20d%3D%22M88%2090%20L112%2090%20L100%2074Z%22%20fill%3D%22%236b4220%22/%3E%3Cg%20transform%3D%22translate%28100%2080%29%22%3E%3Cg%3E%3Cpath%20d%3D%22M-4%20-6%20L4%20-6%20L7%20-44%20L-7%20-44Z%22%20transform%3D%22rotate%2845%29%22%20fill%3D%22%23f1c35c%22%20stroke%3D%22%238a5a2b%22%20stroke-width%3D%222%22%20stroke-linejoin%3D%22round%22/%3E%3Cpath%20d%3D%22M-4%20-6%20L4%20-6%20L7%20-44%20L-7%20-44Z%22%20transform%3D%22rotate%28135%29%22%20fill%3D%22%23f1c35c%22%20stroke%3D%22%238a5a2b%22%20stroke-width%3D%222%22%20stroke-linejoin%3D%22round%22/%3E%3Cpath%20d%3D%22M-4%20-6%20L4%20-6%20L7%20-44%20L-7%20-44Z%22%20transform%3D%22rotate%28225%29%22%20fill%3D%22%23f1c35c%22%20stroke%3D%22%238a5a2b%22%20stroke-width%3D%222%22%20stroke-linejoin%3D%22round%22/%3E%3Cpath%20d%3D%22M-4%20-6%20L4%20-6%20L7%20-44%20L-7%20-44Z%22%20transform%3D%22rotate%28315%29%22%20fill%3D%22%23f1c35c%22%20stroke%3D%22%238a5a2b%22%20stroke-width%3D%222%22%20stroke-linejoin%3D%22round%22/%3E%3Ccircle%20r%3D%225%22%20fill%3D%22%235c3a1a%22/%3E%3C/g%3E%3C/g%3E%3C/svg%3E" alt=""><h1>سنابل الطاحونة</h1><p class="sub">ارفع صورة الكيكة اللي تريدها، وتوصل للكاشير مباشرة</p>
<div class="card" id="c"><p class="mut">لحظة...</p></div><div class="ft">تصميم وتطوير Meras Tech</div></div>
<input type="file" id="f" accept="image/*" multiple hidden>
<script>
var KEY='AIzaSyA1nLRob4JDF8k1FtPqH5rV7Ce0hE53RbU',BASE='https://firestore.googleapis.com/v1/projects/sanabel-cake/databases/(default)/documents/';
var k=(location.search.match(/[?&]k=([A-Za-z0-9]{20,})/)||[])[1],MAX=3,P=[],busy=false,c=document.getElementById('c'),f=document.getElementById('f');
function show(h){c.innerHTML=h}
function bad(m){show('<div class="ok">⏱️</div><p class="msg err">'+m+'</p><p class="mut">اطلب من الكاشير يطلّعلك كود جديد.</p>')}
function req(m,p,b){return fetch(BASE+p+(p.indexOf('?')<0?'?':'&')+'key='+KEY,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}).then(function(r){if(!r.ok){var e=new Error('HTTP '+r.status);e.status=r.status;throw e}return r.json()})}
function shrink(file,mx,q){return new Promise(function(ok,no){var r=new FileReader();r.onerror=no;r.onload=function(){var im=new Image();im.onerror=function(){no(new Error('img'))};im.onload=function(){var s=Math.min(1,mx/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);var g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.drawImage(im,0,0,cv.width,cv.height);ok(cv.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(file)})}
function fit(file){return shrink(file,1280,.78).then(function(d){return d.length<900000?d:shrink(file,900,.7)})}
function draw(){show((P.length<MAX?'<button class="pick" id="pk"><span>📷</span>'+(P.length?'إضافة صورة ثانية':'اختار الصورة')+'<small>تكدر ترفع لحد '+MAX+(MAX>1?' صور':' صورة')+'</small></button>':'')+
(P.length?'<div class="th">'+P.map(function(s,i){return'<div><img src="'+s+'" alt=""><button data-i="'+i+'" aria-label="حذف">✕</button></div>'}).join('')+'</div><button class="go" id="go">إرسال '+(P.length>1?'الصور ('+P.length+')':'الصورة')+'</button>':''))}
c.addEventListener('click',function(e){if(busy)return;var t=e.target.closest('button');if(!t)return;if(t.id==='pk')f.click();else if(t.id==='go')send();else if(t.dataset.i!=null){P.splice(+t.dataset.i,1);draw()}});
f.addEventListener('change',function(){var L=[].slice.call(f.files).slice(0,MAX-P.length);f.value='';if(!L.length)return;show('<p class="mut">جاري تجهيز الصور...</p>');
Promise.all(L.map(fit)).then(function(a){P=P.concat(a).slice(0,MAX);draw()}).catch(function(){draw();alert('ما گدرنا نقرأ الصورة، جرّب صورة ثانية')})});
function send(){busy=true;var i=0;show('<p class="msg">جاري الإرسال...</p><div class="bar"><i id="pb"></i></div>');
function next(){if(i>=P.length)return req('PATCH','qr/'+k+'?updateMask.fieldPaths=st&updateMask.fieldPaths=n',{fields:{st:{stringValue:'done'},n:{integerValue:String(P.length)}}});
return req('PATCH','qrp/'+k+'_'+i,{fields:{d:{stringValue:P[i]},k:{stringValue:k}}}).then(function(){i++;var b=document.getElementById('pb');if(b)b.style.width=Math.round(i/(P.length+1)*100)+'%';return next()})}
next().then(function(){show('<div class="ok">✅</div><p class="msg"><b>تم!</b><br>وصلت '+(P.length>1?'الصور':'الصورة')+' للكاشير</p><p class="mut">تكدر تسكّر هالصفحة وترجع للكاشير يكمل الحجز 🎂</p>')})
.catch(function(e){busy=false;if(e.status===403||e.status===404)bad('انتهت صلاحية هذا الكود');else{draw();alert('ما گدرنا نرسل. تأكد من الإنترنت وجرّب مرة ثانية')}})}
if(!k)bad('الرابط غير صحيح');else req('GET','qr/'+k).then(function(d){var x=d.fields||{},st=(x.st||{}).stringValue,exp=+((x.exp||{}).integerValue||0);MAX=Math.max(1,Math.min(3,+((x.max||{}).integerValue||3)));
if(st!=='wait')return bad('هذا الكود انستخدم قبل');draw()}).catch(function(e){if(e.status===404||e.status===403)bad('انتهت صلاحية هذا الكود');else show('<p class="msg err">ماكو إنترنت</p><p class="mut">شغّل الإنترنت وحدّث الصفحة.</p>')});
</script></body></html>
